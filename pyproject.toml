[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-autopilot"
version = "0.1.0"
description = "Carry a Tenable vulnerability from finding to approval-gated containment and verified, evidenced fix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SecOps Autopilot contributors" }]
keywords = [
  "tenable",
  "vulnerability-management",
  "security-operations",
  "kri",
  "remediation",
  "claude-code",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
secops = "secops_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["secops_autopilot*"]

[tool.ruff]
line-length = 100
target-version = "py310"
